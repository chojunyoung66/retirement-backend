name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # prisma generate·테스트는 DB에 접속하지 않음 — 형식만 맞춘 더미 값
      DATABASE_URL: postgresql://ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
