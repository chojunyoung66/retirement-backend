services:
  - type: web
    name: retirement-backend
    runtime: node
    # NODE_ENV=production이면 npm이 devDependencies를 생략 → tsc/prisma 127
    # --include=dev로 빌드·마이그레이션에 필요한 CLI를 설치한다
    buildCommand: npm install --include=dev && npm run build && node scripts/resolve-failed-migration.js && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
