services:
  - type: web
    name: retirement-backend
    runtime: node
    # Free 플랜은 Pre-Deploy 비활성. Build는 내부 DB DNS 불가(ENOTFOUND).
    # 마이그레이션은 Start에서 실행(런타임은 내부 DB 접근 가능).
    # NODE_ENV=production이라 빌드에 필요한 devDependencies(typescript 등)를 명시적으로 포함
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
