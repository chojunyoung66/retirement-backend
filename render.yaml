services:
  - type: web
    name: retirement-backend
    runtime: node
    # Build 단계에서는 내부 DB 호스트(dpg-…-a) DNS가 안 됨 → ENOTFOUND
    # DB 접근(resolve/migrate)은 Pre-Deploy에서 실행
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: node scripts/resolve-failed-migration.js && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
